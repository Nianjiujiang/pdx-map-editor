<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 构建戳：单文件版由 build_standalone.py 改写成打包时间；
     开发版固定 dev（启动页显示「开发版」）✓
     ⚠ **别用 document.lastModified 当版本戳** ✗ —— 单文件 / 某些浏览器里它会是当前时间 ✓ -->
<meta name="pdx-build" content="dev">
<title>地图编辑器</title>
<script>
// 双击 index.html 打开时浏览器是 file:// 协议，ES module 会被 CORS 拦掉，
// 与其让控制台刷一堆看不懂的报错，不如直接说清楚该怎么办。
if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML =
      '<div style="max-width:620px;margin:12vh auto;padding:32px 36px;'
      + 'font:15px/1.9 \'Segoe UI\',\'Microsoft YaHei\',sans-serif;color:#dfe6ef;'
      + 'background:#151a21;border:1px solid #28313d;border-radius:12px">'
      + '<div style="font:700 24px/1 Georgia,serif;color:#c9a227;letter-spacing:2px;'
      + 'margin-bottom:22px">地图编辑器</div>'
      + '<p style="margin:0 0 18px">这个页面<b>不能直接双击打开</b>。'
      + '浏览器的安全策略不允许 <code style="color:#f0d98a">file://</code> '
      + '加载 ES 模块和地图数据，所以必须走本地服务。</p>'
      + '<p style="margin:0 0 10px;color:#8e9bab">回到项目文件夹，任选一种：</p>'
      + '<p style="margin:0 0 8px">① 双击 <b style="color:#f0d98a">启动.bat</b></p>'
      + '<p style="margin:0 0 22px">② 命令行里跑 '
      + '<code style="color:#f0d98a">python server.py</code></p>'
      + '<p style="margin:0;color:#8e9bab;font-size:13px">'
      + '服务起来后它会自动打开浏览器，地址是 '
      + '<code style="color:#f0d98a">http://127.0.0.1:8777/</code></p>'
      + '</div>';
  });
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="toolbar">
    <div class="brand">
      <span class="brand-mark" id="brand-mark">PDX</span>
      <span class="brand-text">地图编辑器</span>
    </div>

    <!-- 🔴 **剧本 / 地理分成两块** ✗✗（2026-10-19 ✓ 用户要求）
          剧本层可能有上百个（风云世纪两千年 116 个 ✓）——
          全摆成按钮的话顶栏就没法看了 ✗
          → 剧本收进**下拉栏**，地理层照旧摆按钮 ✓
      ⚠ `data-role="era"` 是剧本那几个，`data-role="tier"` 只放地理层 ✓
        （`refreshTierButtons()` 和快捷键都按这个分开 ✓） -->
    <div class="tool-group" id="era-group" hidden>
      <span class="group-label">剧本</span>
      <div class="era-drop" id="era-dd">
        <button class="dd-btn" data-role="era-btn" id="era-btn" aria-haspopup="listbox"
                aria-expanded="false"><span class="dd-label">—</span><span class="dd-caret">▾</span></button>
        <div class="dd-panel" data-role="era-panel" id="era-panel" role="listbox"></div>
      </div>
    </div>

    <div class="tool-group" id="tier-group">
      <span class="group-label">视图</span>
      <div class="segmented" data-role="tier"></div>
    </div>

    <div class="tool-group" id="tool-group">
      <span class="group-label">工具</span>
      <div class="segmented" data-role="tool"></div>
    </div>

    <!-- 🔴 **顶栏折叠**（2026-10-19 ✓ 用户要求"手机版的栏加一个收起折叠功能"✓）
         只在窄屏出现（`#toolbar-fold` 在 `max-width: 1200px` 里才 display:flex ✓）
         收起来时把**工具那一排**藏掉，视图 / 剧本 / 文件都还留着 ✓ -->
    <button id="toolbar-fold" type="button" aria-expanded="true">
      <span class="fold-label">收起</span><span class="fold-caret">▴</span>
    </button>

    <!-- **教程 + 署名：紧跟在左侧工具栏右边** ✓（用户要求）
         ⚠ `author-row` 这个**容器 id 得留着** ✗ —— 手机版按它找（`$('author-row')`）
           搬进「设置」面板；换成别的名字那边就搬不到了 ✓ -->
    <div class="tool-group actions" id="help-row">
      <button class="btn ghost" id="btn-tutorial">教程</button>
      <div class="tool-group actions" id="author-row">
        <a class="btn ghost" id="btn-author">永夜廿九</a>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="tool-group actions" id="settings-row">
      <button class="btn ghost" id="btn-settings">设置</button>
    </div>

    <div class="tool-group actions" id="history-row">
      <button class="btn ghost" id="btn-undo" disabled>↶</button>
      <button class="btn ghost" id="btn-redo" disabled>↷</button>
    </div>

    <!-- 回选地图那一页 ✓（键盘上按 Esc 也一样 ✓） -->
    <div class="tool-group actions" id="home-row">
      <button class="btn ghost" id="btn-home">主菜单</button>
    </div>

    <!-- **「文件」：顶栏最右边** ✓（用户要求：导入 / 导出 / 清除都收进这一个菜单 ✓）
         ⚠ 容器 id 必须还是 export-row、菜单还是 export-menu ✗ ——
           手机版按这两个 id 找（`move(gIO, $('export-row'))`，再把 export-menu 的子项摊平 ✓）
           所以这里**既没改名、也没动手机版**，而导入 / 清除放进菜单里之后，
           手机版的「文件」面板会自动一起带上它们 ✓ -->
    <div class="tool-group actions" id="export-row">
      <button class="btn ghost" id="btn-export">文件 ▾</button>
      <div class="dropdown" id="export-menu" hidden>
        <button class="btn ghost" id="btn-import">导入</button>
        <button class="btn ghost" id="btn-png">导出窗口</button>
        <button class="btn ghost" id="btn-png-full">导出整图</button>
        <!-- **高清导出**：输出宽高都 ×2，边界按新尺度重画 ✓（不是放大糊 ✗）
             一个地图像素变 2×2，细边界不再互相咬掉 ✓（用户要求 ✓）-->
        <button class="btn ghost" id="btn-png-full2">导出高清地图</button>
        <button class="btn ghost" id="btn-project">导出涂色</button>
        <!-- 出毛病时把这一份发给作者就行 ✓（日志模块是 js/log.js，比 app.js 先加载 ✓） -->
        <button class="btn ghost" id="btn-log">导出日志</button>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">

      <section class="panel" id="display-panel">
        <div class="panel-head"><h2>显示</h2></div>
        <div class="tool-group actions stack">
    <!-- 🔴🔴 **显示区各组的排法**（2026-10-16 用户定的 ✓ 全体统一）：
         **边界 → 名称 → 颜色 →（父级边界 / 只在「地块」那组 ✓）** ✓
         ⚠ 以前是「颜色 / 边界 / 名称」（照 v1.8 那套排的 ✗）——
           用户 2026-10-16 点名改成这个顺序 ✓ 各组一致 ✓ 缺的项跳过 ✓
         🔴 **2026-10-17：「剧本」那一整组删了** ✗（用户："三个开关已经没什么用了"✓）
            剧本颜色固定开、剧本边界固定关、剧本名称本来就跟「势力 · 名称」同一个状态 ✓
            → 下面只剩「地块 / 势力 / 水域 / 荒地」四组 ✓ -->
    <div class="tool-group" id="region-group">
      <!-- 🔴 **2026-10-16 用户定的：这组叫「地块」** ✗（原来是「地区」✓）
           原话："显示设置那边的地区也改为地块"✓
           ⚠ **只改这个显示标签** ✗ —— `id="region-group"` 与里面那三个开关的 id
             一律不动 ✓（`applyGameUI` 按 id 显示/隐藏这一组 ✓ 改了它就失效 ✓）
           ⚠ 跟设置页「边界」栏那个「地区」小标题**不是一回事** ✗ ——
             那个说的是行政区划那一级（父级链 ✓ 用户 2026-10-16 确认保留 ✓）-->
      <span class="group-label">地块</span>
      <label class="switch">
        <input type="checkbox" id="show-region-border" checked>
        <span>边界</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="show-region-name">
        <span>名称</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="show-region-color">
        <span>颜色</span>
      </label>
      <!-- **父级边界排最后** ✓ —— 它不是"三件套"之一 ✗
           是个**附加档**（只管上面那一级画不画 ✓ 见 syncParentBorder ✓） -->
      <label class="switch" id="parent-border-row">
        <input type="checkbox" id="show-parent-border">
        <span>父级边界</span>
      </label>
    </div>

    <div class="tool-group">
      <!-- 🔴 **2026-10-17：这组从「填色」改名「势力」** ✓（用户原话："把显示区的
           涂色两个字改成势力"✓）
           ⚠ 只改**显示标签** ✗ —— 里面三个 id（show-border-paint / show-labels-paint /
             show-paint）一律不动 ✓ 它们是玩家涂色层的老接口，改名会牵一大片 ✓ -->
      <span class="group-label">势力</span>
      <label class="switch">
        <input type="checkbox" id="show-border-paint" checked>
        <span>边界</span>
      </label>
      <!-- 势力自己的「名称」开关 —— 任何一代游戏这一组都在 ✓
           （「剧本」那组已经删了，现在这里是势力名称唯一的入口 ✓） -->
      <label class="switch">
        <input type="checkbox" id="show-labels-paint" checked>
        <span>名称</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="show-paint" checked>
        <span>颜色</span>
      </label>

    </div>

    <!-- 🔴 **水域那一组**（2026-10-16 用户点名的 ✓ 见 handover §3.1）
         ⚠ 只有**边界 / 名称**两条 ✗ —— 「颜色」那个勾**不给** ✓
           （用户原话："水域不加入关于颜色的开关，只有关于边界和名称的开关"✓）
         🔴🔴 **两个都默认「不勾」** ✗✗（2026-10-17 用户改的 ✓
           原话："默认关闭水域边界、名称"✓
           2026-10-16 那版两个都是勾上的 ✓ 理由曾是"默认观感完全不变"✓
           现在反过来了 ✓ → 开图时水域之间那些缝**不画**、水名**不出** ✓
           想看得自己勾 ✓ **HTML 这里不许再写 `checked`** ✗
             （去掉它 = 开图前那几百毫秒界面就跟状态一致 ✓
              开图后 `applyGameUI` 还会照 `state` 再刷一遍 ✓ 两道都对得上 ✓））
         ⚠ 位置**必须排在「地块 / 势力」之后** ✗✗ ——
            `tutorial.js` 的 `firstNamedSwitch()` 取的是"界面上**第一个**文字含「名称」的开关"✓
            插到前面去的话，教程那一步会改指水域 ✓（顺序敏感，别挪 ✗）
           （「剧本」那组已经删了：现在第一个含「名称」的是「地块」组 ✓）
         ⚠ 口径（用户原话）：
           "水域边界开关负责且仅负责**水域之间**（海洋、湖泊、河流、不可通行水域）
            的边界的显示或隐藏。水域名称开关同理。
            同时受管理的这些东西**不再受地区边界、地区名称的管理**。"✓
           → 海岸线（水 ↔ 陆）**不归它** ✓ 照旧由「地块 / 势力 · 边界」管 ✓ -->
    <div class="tool-group" id="water-group">
      <span class="group-label">水域</span>
      <label class="switch">
        <input type="checkbox" id="show-water-border">
        <span>边界</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="show-water-name">
        <span>名称</span>
      </label>
    </div>

    <!-- 🔴 **荒地那一组**（2026-10-17 用户要的 ✓）
         原话（先要名称）："显示区加一行，关于荒地的名称开关"✓
         原话（再要边界）："给荒地加上边界开关，这个负责的是**荒地与荒地之间**的边界，
                            你之前做了水域-水域的边界，这个应该轻车熟路了吧"✓
         → 所以现在是**两条**：边界 + 名称 ✓
           **边界** = 荒地 ↔ 荒地之间的缝 ✓（挨着陆地 / 水的那一圈外缘**不归它** ✗
             照旧归「地块 · 边界」/「势力 · 边界」✓ 跟水域那条一个口径 ✓）
           **名称** = 荒地自己的名字（`wl_*` / `#wasteland*` / 未编进州里的陆地 ✓）
             它跟「地块 · 名称」**各管各的** ✓（荒地有自己的开关之后，
               关掉「地块 · 名称」不该把荒地名一起带走 ✓ 这一条 2026-10-17 改的 ✗
               在那之前荒地名是跟着「地块 · 名称」走的 ✓）
         🔴 **2026-10-17 追加「自动上色」** ✗✗（用户点名要的 ✓）
           开：按周边陆地最低地块的颜色加权，严格过半才给这块荒地 ✓
           关：全部回退设置里「不可通行区域」那个色 ✓
           ⚠ 它不是"荒地颜色"那个勾 ✗ —— 那个仍然在设置页里管所有地形类色 ✓
             这一条只管"自动算出来的那份归属色" ✓
         ⚠ **三个都默认不勾** ✗（2026-10-17 用户定的：自动上色也默认关闭 ✓
           想要上色自己勾 ✓ 别在 HTML 里写 checked ✓）
         ⚠ 顺序 **边界 → 名称 → 自动上色** ✓（跟别组一个排法 ✓）
         ⚠ 位置排在「水域」之后 ✓ —— `tutorial.js` 的 `firstNamedSwitch()`
           取的是"第一个含「名称」的开关"= `#show-power-names` ✓ 这边怎么排都不影响 ✓ -->
    <div class="tool-group" id="waste-group">
      <span class="group-label">荒地</span>
      <label class="switch">
        <input type="checkbox" id="show-waste-border">
        <span>边界</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="show-waste-name">
        <span>名称</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="waste-auto">
        <span>自动上色</span>
      </label>
    </div>

    <!-- 🔴 **清除按钮搬到显示区**（2026-10-17 用户定的 ✓）
         「清除全部」= 原来的 `resetAll()`（全部涂色 + 撤销栈）
         「清除荒地」= 只动手绘层里的荒地块 + 关掉自动上色、刷回荒地灰
         ⚠ id `btn-reset` 不许改 ✗ —— app.js 的处理器和自检都按它找 ✓ -->
    <div class="tool-group" id="clear-group">
      <span class="group-label">清除</span>
      <button class="btn ghost" id="btn-reset" type="button"
              title="清除这张图上的全部涂色（会清空撤销栈）">清除全部</button>
      <button class="btn ghost" id="btn-clear-waste" type="button"
              title="清除荒地上的涂色，并关闭「荒地 · 自动上色」">清除荒地</button>
    </div>

        </div>

      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>当前颜色</h2>
          <!-- ⚠ **原来这儿有个提示**（`#brush-target`，写「1789 · 涂抹」那种）✗
               2026-10-17 用户："红框框的部分去掉"✓ → 整个 span 拿掉了 ✓
               ⚠ 配套在 app.js：`updateBrushTarget()` 那个函数和它的三处调用**一起删了** ✗
                 （函数体就一句 `$('brush-target').textContent = …` ✓
                  光删 HTML 会让它每帧去写一个 null ✗ 那种"留着半条线"的最难查 ✓
                  ——见 `setTool` / `applyEditTier` / `选工具` 那三处 ✓）
               → 想知道"这一笔按哪一级涂"看**层级按钮**那排就够 ✓（那儿本来就亮着 ✓） -->
        </div>
        <div class="brush">
          <div class="swatch big" id="brush-swatch"></div>
          <!-- 点色块弹的就是它：跟设置页里那些 <input type="color"> 同一个系统取色器 ✓
               （藏在旁边、不进布局；别用 display:none，某些浏览器就不弹了 ✗） -->
          <input type="color" id="brush-color" class="swatch-input" aria-label="取色">
          <div class="brush-fields">
            <label>HEX <input type="text" id="brush-hex" maxlength="7" spellcheck="false" autocomplete="off"></label>
            <div class="rgb-row">
              <label>R <input type="number" id="brush-r" min="0" max="255"></label>
              <label>G <input type="number" id="brush-g" min="0" max="255"></label>
              <label>B <input type="number" id="brush-b" min="0" max="255"></label>
            </div>
            <label>标记
              <input type="text" id="brush-label" spellcheck="false" autocomplete="off">
            </label>
          </div>
        </div>
        <div class="label-pick" id="label-pick" hidden>
          <span id="label-pick-hint">这个颜色在数据里归好几个头衔，挑一个当标记：</span>
          <select id="label-select"></select>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>悬停地块</h2>
          <span class="hint" id="hover-pid">—</span>
        </div>
        <div class="chain" id="hover-chain">
          <p class="empty">把鼠标移到地图上看看。</p>
        </div>
      </section>

      <section class="panel grow">
        <div class="panel-head">
          <h2 id="hdr-search">查找头衔</h2>
          <span class="hint" id="search-count"></span>
        </div>
        <!-- autocomplete=off：**别让浏览器把它当"要记的表单"** ✗
             以前没有这一条，Chrome 就把你打过的词存进「保存的信息」，
             下次一点搜索框就弹那个白色下拉（"荒谬法律""Kurds" …）——
             那不是我们画的界面，是浏览器的自动填充。
             顺带：那个下拉开着时按回车，浏览器会拿它当"选中建议"，
             跟"回车跳第一条结果"撞车 ✓ 关掉就都安静了。 -->
        <input type="search" id="search" placeholder="" autocomplete="off"
               spellcheck="false" autocorrect="off" autocapitalize="off">
        <div class="results" id="results">
          <p class="empty">支持中文名、英文名、c_/d_/k_/e_ 开头的 key</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>最近使用</h2>
          <!-- 清空"最近用过" ✓（这份是**跟着设置持久化**的，所以清完也要落盘 ✓ 见 clearRecent）-->
          <button type="button" class="btn ghost" id="btn-clear-recent" title="清空这些记忆的颜色">清空</button>
        </div>
        <div class="palette" id="palette"></div>
      </section>

    </aside>

    <main class="stage" id="stage">
      <canvas id="map"></canvas>
      <canvas id="overlay"></canvas>
      <div class="hover-card" id="hover-card" hidden></div>
      <div class="zoom-box">
        <button class="btn tiny" id="btn-zoom-out">−</button>
        <button class="btn tiny" id="btn-zoom-in">＋</button>
        <button class="btn tiny" id="btn-zoom-fit">⤢</button>
      </div>
      <div class="toast" id="toast" hidden></div>

      <div class="boot" id="boot">
        <div class="boot-inner" id="boot-inner">
          <div class="boot-title" id="boot-title">地图编辑器</div>

          <div class="map-pick" id="map-pick" hidden>
            <div class="map-pick-hint">选一张地图</div>
            <!-- 一张图都没有的时候（轻量版第一次打开就是这样）说清楚下一步干嘛 ✓
                 有卡片了 app.js 会把它藏起来 ✓ -->
            <div class="map-empty" id="map-empty" hidden>
              请点击下方按钮导入，或将 .pdxmap 文件直接拖进这一页。
            </div>
            <div class="map-pick-list" id="map-pick-list"></div>
            <button class="map-import" id="map-import">＋ 导入地图包…</button>
            <!-- 这行平时**是空的** ✗ —— 只有"这台浏览器存不下东西"的时候才跳出来警示
                 （"刷新就没了"那句必须让玩家看见，所以位置留着 ✓） -->
            <div class="map-import-hint" id="map-import-hint" hidden></div>
            <div class="map-msg" id="map-msg" hidden></div>
          </div>

          <!-- ⚠ **这里原来有个「⋯」管理小面板** ✗（四个按钮：导出备份 / 删除 / 关闭 + 标题）
               2026-10-12 起「导出备份 / 删除」两个动作**直接长在卡片上**了 ✓
               面板连元素带样式整个拆掉 —— 留一堆没人引用的死 markup 只会
               （a）让"页面上还有没有那个面板"那条自检一直是红的 ✓
               （b）哪天谁又给它接上线，"关不掉"那个坑原样回来 ✓
               （2026-10-17 那条线合并回来时把这段 markup 带回来了 ✗ 现在再删一次 ✓）
               ⚠ **注释里也别写出那个 id / 类名** ✗ —— 自检是按字面量扫整份 HTML 的，
                 连注释一起抓（这条规矩别处也踩过 ✓）-->

          <div id="boot-progress">
            <div class="boot-step" id="boot-step">正在准备…</div>
            <div class="boot-bar"><i id="boot-bar"></i></div>
          </div>

          <!-- 署名：谁做的、去哪找人。href 由 app.js 按 AUTHOR 填（换主页只改那一处 ✓）
               🔴 **分两行**（2026-10-17 用户："那些字挤在一起很难看"）：
                   第一行 作者 + 主页；第二行 导出诊断报告 + 版本戳 ✓ -->
          <div class="boot-author">
            <div class="boot-author-row">
              <span>永夜廿九 制作</span>
              <a class="boot-author-link" id="author-link" target="_blank" rel="noopener">B 站主页 →</a>
            </div>
            <div class="boot-author-row boot-author-row-split">
              <!-- 版本戳在**左**、导出按钮在**右**（2026-10-17 用户定的 ✓）
                   ⚠ 接线在 log.js 里，**不在 app.js** ✗ —— 编辑器自己没起来时，
                     app.js 里的入口根本挂不上，而那时正是最需要日志的场合 ✓ -->
              <span class="boot-ver" id="boot-ver"></span>
              <button class="boot-author-link boot-log-btn" id="btn-boot-log" type="button"
                      title="导出诊断报告（含启动阶段 / 浏览器 / 显卡信息）">导出诊断报告</button>
            </div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <!-- 选文件只认 .pdxmap / .zip（别的一律拒，见 pack.js 的校验器）
       ⚠ `application/octet-stream` **必须留着** ✗（2026-10-12 用户报的"手机上选不中 pdxmap"）：
         `.pdxmap` 是自定义扩展名，系统不认 → 类型就是 `application/octet-stream` ✓
         安卓的文件选择器**按 MIME 过滤**，不列它就把 `.pdxmap` 灰掉 ✓
         （手机版还会在 bindMobile 里把过滤整个放开，见 mobile/mobile_js.txt ✓）
       ⚠ 这一行是**从 10-12 的备份还原时补回来的** ✗ —— 那个底子比它早几个钟头 ✓
       ⚠ `multiple` 也要留着 ✗（2026-10-12 用户要求：**多个包一起导入** ✓）-->
  <input type="file" id="pack-file"
         accept=".pdxmap,.zip,application/zip,application/octet-stream" multiple hidden>

  <footer class="statusbar">
    <span id="status-meta">—</span>
    <div class="spacer"></div>
    <span id="status-pos">—</span>
    <span id="status-zoom">—</span>
    <span id="status-changes">改动 0</span>
  </footer>

</div>
<!-- 报错日志：**必须排在 app.js 前面** —— 编辑器自己没起来的时候，
     它是唯一还能记录现场的东西 ✓（普通脚本，挂 window.PDXLOG；见 js/log.js） -->
<script src="js/log.js"></script>
<script src="js/tutorial.js"></script>
<script type="module" src="js/app.js"></script>

  <!-- 二级设置页（右上角「设置」开） -->
  <div class="modal" id="settings" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>设置</h2>
        <button class="btn ghost" id="set-close">关闭</button>
      </div>

      <div class="set-grid">
        <div class="set-col">
          <h3>颜色</h3>
          <!-- 🔴 **2026-10-16 两轮收拾**
               第一轮（"全都进行全面优化"）：七项平铺 → 按类别分组 + `.set-sub` 小标题 ✓
               第二轮（"就这样，简单点"）：用户把**两组的内容和名字都定了** ✗：
                 · **陆地**：空白区域 / 无归属区域 / **不可通行区域**（它归陆地 ✓ 不是水 ✓）
                 · **水域**：**河流 / 湖泊 / 海洋 / 不可通行海域**（次序也是他定的 ✓
                   由小到大：河最细、海最大、不可通行海域是屏障 ✓
                   原来我排的是"海 / 不可通行海域 / 湖 / 河"，正好倒过来 ✓）
               ⚠ **只有两组了** ✗ —— 第一轮我分过"底子 / 水域 / 陆地"三组 ✓
                 用户这一轮把"底子"并进**陆地**、把"不可通行区域"从陆地那组挪对位置 ✓
                 → 别再加回第三个组 ✗ -->
          <div class="set-sub">陆地</div>
          <label class="set-row"><span>空白区域</span><input type="color" id="set-bg"></label>
          <label class="set-row"><span>无归属区域</span><input type="color" id="set-unpainted"></label>
          <label class="set-row"><span>不可通行区域</span><input type="color" id="set-impass"></label>
          <div class="set-sub">水域</div>
          <label class="set-row"><span>河流</span><input type="color" id="set-river"></label>
          <label class="set-row"><span>湖泊</span><input type="color" id="set-lake"></label>
          <label class="set-row"><span>海洋</span><input type="color" id="set-sea"></label>
          <label class="set-row"><span>不可通行海域</span><input type="color" id="set-isea"></label>
        </div>

        <!-- ============ 边界（**一栏装完** ✓）============
             命名规范（用户 2026-10-16 **第二轮**定的 ✓）：**小标题给类别、滑条只写「边界宽度 / 边界不透明度」**
           —— 用户原话："**最大关键点：滑块左边就写边界宽度而不是省份边界宽度**"✓
           ⚠ 所以这一栏里**再也没有「省份边界宽度」这种长标签** ✗ ——
             类别由它上面那个 `.set-sub` 说（省份 / 地区 / 势力 / 水域 ✓）、
             两行只说"这条线有多粗 / 有多实" ✓（这才叫"简单点"✓）
           ⚠ 那两行的标签 2026-10-16 又改了一次 ✗：「浓度」→「**边界不透明度**」✓
             用户先写"把边界浓度改名边界不透明度"、接着纠正"是【边界不透明度】不是【不透明度】"✓
             ——**四个字的全名** ✓ 别缩成「不透明度」✗（那是「名字」栏那组小标题的名字 ✓）
           ⚠ 小标题旁边那些提示（本层那条线 / 父级链 / 国家·剧本那一圈 /
             只管水与水之间 / 字号与上限）**全清了** ✗（用户："红框框圈起来的东西去掉"✓
             结构上不再有 `.set-sub` + hint 那种写法 ✓ 要说明就写在这段注释里 ✓）
           ⚠ 但**内部字段名一个都没改** ✗：`wProv` / `wRegion` / `pw` / `waterW`、
             `pa` / `ra` / `ca` / `waterA` ✓（老存档、设置项、测试全按这些键走 ✓
              改的是**界面上那几个字**，不是键 ✓）
           四类各自管哪条线（**只写在这儿** ✗ 界面上既不逐行重复、也不挂提示 ✓）：
             省份 = 管**本层**那条线（子级线 ✓ 海岸线 / 海内细缝都归它 ✓）
             地区 = 管**父级链**（多级链上层那些线 ✓）
             势力 = 国家 / 剧本那一圈 ✓     水域 = 只管水与水之间 ✓
           档位（`min/max/step` 一锁就天然只有那几档 ✓）：宽度 0.5~3 步长 0.5 ·
             不透明度 0~100 步长 25（**0% = 那条线完全不画** ✓）
           线宽一律是**格数**（不是倍率 ✗）
           每个滑条前面那个当前值提示由 `buildSliderTips()` 动态插进来 ✓
           （`min/max/step` 要跟 app.js 里那几张档位表一致 —— 测试盯着两边 ✓）-->
        <div class="set-col">
          <h3>边界</h3>
          <!-- 🔴🔴 **2026-10-16 两轮收拾** ✗✗
               第一轮（"全都进行全面优化"）：从"四根宽度挨着、四根浓度挨着"改成
                 **一类两行连排**（省份宽+浓 · 地区宽+浓 · … ✓）✓
               第二轮（"就这样，简单点"）：**滑条标签砍掉重复的类别名** ✗ ——
                 「省份边界宽度」→「边界宽度」（类别靠小标题说 ✓）
               ⚠ 小标题上那两句提示（"本层那条线" / "父级链"）留着 ✓
                 用户 2026-10-13 报过"这两根到底差在哪"✓ 那是**真的分不清** ✓
                 而"省份"两个字重复两遍是**纯废话** ✓ 两回事 ✓
               ⚠ 别再把类别名加回滑条标签 ✗ —— `test_modes` 有一条断言盯着它 ✓ -->
          <div class="set-sub">省份</div>
          <label class="set-row"><span>边界宽度</span><input type="range" id="set-w-prov" min="0.5" max="3" step="0.5"></label>
          <label class="set-row"><span>边界不透明度</span><input type="range" id="set-pa" min="0" max="100" step="25"></label>
          <div class="set-sub">地区</div>
          <label class="set-row"><span>边界宽度</span><input type="range" id="set-w-region" min="0.5" max="3" step="0.5"></label>
          <label class="set-row"><span>边界不透明度</span><input type="range" id="set-ra" min="0" max="100" step="25"></label>
          <div class="set-sub">势力</div>
          <label class="set-row"><span>边界宽度</span><input type="range" id="set-pw" min="0.5" max="3" step="0.5"></label>
          <label class="set-row"><span>边界不透明度</span><input type="range" id="set-ca" min="0" max="100" step="25"></label>
          <!-- 🔴 **水域边界那一对**（2026-10-16 ✓ 用户点名要的 ✓）
               ⚠ 用户原话："新增一对滑条「水域边界宽度 / 浓度」（**不沿用省份/地区那一档**）"✓
                 → 所以它俩是**独立一档** ✓
               ⚠ 「水域边界宽度」**不是**「海域宽度」✗ ——
                 用户 2026-10-16 的命名规范里明写了不许再叫「海域宽度 / 海域浓度」✓
                 （test_modes 里有两条断言盯着这两个词不许出现 ✓
                   ⚠ 第二轮把标签砍成「边界宽度」之后，"海域宽度"更不会出现了 ✓
                     但那条断言**留着** ✓ 它守的是"别又冒出个旧名字" ✓）-->
          <div class="set-sub">水域</div>
          <label class="set-row"><span>边界宽度</span><input type="range" id="set-water-w" min="0.5" max="3" step="0.5"></label>
          <label class="set-row"><span>边界不透明度</span><input type="range" id="set-water-a" min="0" max="100" step="25"></label>
          <!-- 🔴 **荒地边界那一对**（2026-10-17 ✓ 用户点名要的 ✓）
               原话："给荒地加上边界开关，这个负责的是**荒地与荒地之间**的边界，
                      你之前做了水域-水域的边界，这个应该轻车熟路了吧"✓
               ⚠ 跟水域那对**完全同构** ✗ —— 独立一档、不沿用省份/地区那档 ✓
                 档位也一样（宽度 0.5~3 步长 0.5 · 不透明度 0~100 步长 25 ✓）
                 出厂值也一样（1 / 25% ✓ 默认都是"很淡的辅助线"✓）
               ⚠ 不透明度 **0% = 那条线完全不画** ✓（跟别处同一个口径 ✓
                 不是"线还在但看不见"✗）
               ⚠ 两条通道**各认自己的勾** ✗（关掉水域那个，荒地这条照样在 ✓ 反之亦然 ✓）-->
          <div class="set-sub" id="set-waste-sub">荒地</div>
          <label class="set-row" id="set-waste-w-row"><span>边界宽度</span><input type="range" id="set-waste-w" min="0.5" max="3" step="0.5"></label>
          <label class="set-row" id="set-waste-a-row"><span>边界不透明度</span><input type="range" id="set-waste-a" min="0" max="100" step="25"></label>
        </div>

        <div class="set-col">
          <h3>名字</h3>
          <!-- 🔴🔴 **2026-10-17 整栏重排：两块 —— 地块 / 势力** ✗✗（用户定的 ✓）
               原话："首先是把字号分开两个，一个给地块，一个给势力
                     然后分块就分两块，一个地块一个势力，下面就是各自的字号、不透明度、上限。
                     所以这样也可以去掉那个势力or地块前缀了，更方便。"

               改之前是"**按维度分三组**"（字号与数量 / 不透明度 ✓）——
                 字号还**只有一根、两块共用** ✗ → 调大地名，国名跟着一起大 ✓ 两件事绑死 ✓
               改之后是"**按对象分两块**"：
                 【地块】字号倍率 · 不透明度 · 上限      ← 三行都管**地块名**
                 【势力】字号倍率 · 不透明度 · 上限      ← 三行都管**势力名**
               ⚠ 标签因此**去掉了前缀** ✓：「地块名称不透明度」→「不透明度」✓
                 （块头已经说了是谁的 ✓ 用户原话："可以去掉那个势力or地块前缀了"✓）
                 ⚠ 但**注释里要写清哪根是哪根** ✗ —— 界面上省字，代码里不能省 ✓
                   `set-labelap` = 地块那根 ✓ `set-labelac` = 势力那根 ✓
                   `set-labelplacemax` = 地块上限 ✓ `set-labelmax` = 势力上限 ✓
                   `set-fontplace` / `set-fontpower` = 两块字号（2026-10-17 新加的 ✓）
               ⚠ 顺序按用户说的：**字号 → 不透明度 → 上限** ✓（原话那个次序 ✓
                 跟旧的"字号/上限 一组、不透明度 一组"不一样 ✗ 别按旧的排回去 ✓）-->

          <div class="set-sub">地块</div>
          <!-- **字号倍率**（🔴 2026-10-17 用户改的：**0.5~3 · 步长 0.1** ✓
               原来是 0.5~2 · 步长 0.05 ✓ —— 上限太低、档太密 ✓）：
               管**地块名**（含海 / 湖 / 河 / 荒地名 ✓）
               ⚠ 2026-10-17 之前它跟势力名**共用** `s.font` 一个数 ✗
                 现在拆成 `fontPlace` / `fontPower` ✓ 老存档那个数两块都继承 ✓ -->
          <label class="set-row"><span>字号倍率</span><input type="range" id="set-fontplace" min="0.5" max="3" step="0.1"></label>
          <label class="set-row"><span>不透明度</span><input type="range" id="set-labelap" min="25" max="100" step="25"></label>
          <!-- **地块名上限**（2026-10-16 用户定的 ✓）
               地名改成"**每个连通域一个标**"之后，一个头衔底下可能一堆碎块
               （CK3 的飞地 / EU4 的岛群 ✓）→ 按**每个头衔**各留 N 个 ✓
               档位跟势力那根同款（1~21，拉满 = 无上限 ✓ 默认 12 ✓）
               数值提示放**滑块左边** ✓（放右边会把滑块挤到中间、跟别的行对不齐 ✓）-->
          <label class="set-row"><span>上限</span><span class="hint" id="set-labelplacemax-v"></span><input type="range" id="set-labelplacemax" min="1" max="21" step="1"></label>

          <div class="set-sub">势力</div>
          <!-- **势力名 = 剧本 / 年份那几层 + 玩家涂出来的色块名** ✓（见 drawLabels 那头 ✓）
               上限的"一组"是**一个国家**（本土 + N 块殖民地那种 ✓ 用户的原意 ✓）
               ⚠ 默认别压太狠 ✗（用户报过"国名很多没显示"✓）：
                 真正决定画面上能看见几个的是**字号门槛**，这一档是**再砍一刀** ✓ -->
          <label class="set-row"><span>字号倍率</span><input type="range" id="set-fontpower" min="0.5" max="3" step="0.1"></label>
          <label class="set-row"><span>不透明度</span><input type="range" id="set-labelac" min="25" max="100" step="25"></label>
          <label class="set-row"><span>上限</span><span class="hint" id="set-labelmax-v"></span><input type="range" id="set-labelmax" min="1" max="21" step="1"></label>
        </div>

        <div class="set-col">
          <h3>其他</h3>
          <!-- ⚠ 组名从「导出图例」缩成「**图例**」✓（2026-10-16 用户："就这样，简单点"✓
               它底下就三行（导出时显示 / 标题 / 位置 ✓）—— 四个字的组名比内容还长 ✓
               ⚠ 「位置」原来写的是裸的「位置」✓ 保留 ✓（上下文已经是图例了 ✓）-->
          <div class="set-sub">图例</div>
          <label class="set-row"><span>导出时显示</span><input type="checkbox" id="set-legend"></label>
          <label class="set-row"><span>图例标题</span><input type="text" id="set-legend-title" maxlength="40" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></label>
          <label class="set-row"><span>位置</span>
            <select id="set-legend-pos">
              <option value="tl">左上</option>
              <option value="tr">右上</option>
              <option value="bl">左下</option>
              <option value="br">右下</option>
            </select>
          </label>
          <div class="legend-list" id="legend-list"></div>
          <div class="set-sub">取色</div>
          <!-- 取完色（搜索里点色块 / 右键 / 吸管 / 调色板）自动切到哪个画图工具 ✓
               已经在涂抹或填色上时**不动** —— 别打断正在画的活儿 ✓ -->
          <label class="set-row"><span>取色后切到</span>
            <select id="set-picktool">
              <option value="paint">涂抹</option>
              <option value="fill">填色</option>
            </select>
          </label>
          <div class="set-row"><span></span><button class="btn ghost" id="set-reset">恢复默认</button></div>
        </div>

      </div>
    </div>
  </div>

  <!-- 改名小弹窗（改名工具点了之后开） -->
  <div class="modal" id="rename" hidden>
    <div class="modal-box rename-box">
      <div class="modal-head"><h2>改名</h2></div>
      <input type="text" id="rename-input" class="rename-input" placeholder="新的名字" autocomplete="off">
      <div class="rename-foot">
        <button class="btn ghost" id="rename-cancel">取消</button>
        <button class="btn" id="rename-ok">确定</button>
      </div>
    </div>
  </div>
</body>
